[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelassess"
version = "0.1.0"
description = "Kernel Security & Lifecycle Assessment for SUSE Linux Enterprise fleets (IBM Power focus)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "Jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
kernelassess = "kernelassess.cli:main"

[tool.setuptools.packages.find]
include = ["kernelassess*"]

[tool.setuptools.package-data]
kernelassess = ["data/*.yaml", "web/templates/*.html"]
