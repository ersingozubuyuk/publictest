services:
  kernelassess:
    build: .
    image: kernelassess:latest
    container_name: kernelassess
    restart: unless-stopped
    ports:
      # Erişimi kısıtlamak için "127.0.0.1:8080:8080" yapıp SSH tüneli ile bağlanabilirsiniz.
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?.env dosyasinda DASHBOARD_PASSWORD tanimlayin}
      REFRESH_HOURS: ${REFRESH_HOURS:-24}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - kernelassess-data:/data
    mem_limit: 1g

volumes:
  kernelassess-data:
